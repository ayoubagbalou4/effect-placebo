<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Effect Placeboo</title>

<style>

body {
    font-family: Arial, sans-serif;
    color: black;
    text-align: center;
    padding: 40px;
}

textarea {
    width: 600px;
    max-width: 90%;
    height: 180px;
    padding: 10px;
    margin: 5px;
    color: black;
    border: 1px solid #555;
    resize: vertical;
    box-sizing: border-box;
}

input {
    width: 40px;
    background-color: transparent;
    color: black;
    border: 1px solid #555;
    box-sizing: border-box;
}

button {
    margin: 5px;
    cursor: pointer;
    border: 0;
    border-radius: 3px;
}

.btn {
    background-color: green;
    color: white;
}

.btnn {
    background-color: transparent;
    color: white;
    border: 1px solid #555;
}

.btnn:hover {
    background-color: #333;
}

.controls {
    margin-top: 15px;
}


.controls button:hover {
    background-color: #555;
}

.jump-box {
    margin-top: 15px;
}



iframe {
    margin-top: 2000px;
    border: 0;
    max-width: 100%;
}

/* Hide scrollbar */
::-webkit-scrollbar {
    width: 0;
    height: 0;
}

</style>

</head>

<body>

<h2>Remove Duplicate Domains</h2>

<!-- =========================
     DOMAIN INPUT
========================= -->

<textarea
    id="domains"
    placeholder="Paste domains here..."
></textarea>

<br>

<button
class="btn"
onclick="removeDuplicates()"

>

Remove Duplicate Domains

</button>

<br><br>


<textarea
    id="result"
    placeholder="Unique domains..."
    readonly
></textarea>

<hr style="margin: 20px 0;">



<input
id="url"
placeholder=""

>

<button
class="btnn"
onclick="playVideo()"

>

</button>

<br><br>



<div class="controls">


<button onclick="resumeVideo()">

</button>

<button onclick="pauseVideo()">

</button>

<button onclick="skipBack()">
 
</button>

<button onclick="skipForward()">
  
</button>


</div>



<div class="jump-box">


<input
    id="jumpTime"
    placeholder=""
>

<button onclick="jumpToTime()">
    
</button>


</div>


<iframe
    id="player"
    width="560"
    height="315"
    src=""
    title="YouTube video player"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
</iframe>

<script>


/* =====================================================
   REMOVE DUPLICATE DOMAINS
===================================================== */

function removeDuplicates() {

    const lines =
        document
            .getElementById("domains")
            .value
            .split(/\r?\n/)
            .map(x => x.trim())
            .filter(x => x !== "");

    const unique =
        [...new Set(lines)];

    document
        .getElementById("result")
        .value =
        unique.join("\n");
}


/* =====================================================
   GET YOUTUBE VIDEO ID
===================================================== */

function getVideoId(url) {

    try {

        const u = new URL(url);

        /*
         * youtube.com/watch?v=VIDEO_ID
         */

        if (
            (
                u.hostname === "youtube.com" ||
                u.hostname === "www.youtube.com"
            ) &&
            u.pathname === "/watch"
        ) {

            return u.searchParams.get("v");
        }


        /*
         * youtu.be/VIDEO_ID
         */

        if (
            u.hostname === "youtu.be" ||
            u.hostname === "www.youtu.be"
        ) {

            return u.pathname
                .substring(1)
                .split("/")[0];
        }


        /*
         * youtube.com/live/VIDEO_ID
         */

        if (
            u.hostname === "youtube.com" ||
            u.hostname === "www.youtube.com"
        ) {

            if (
                u.pathname.startsWith("/live/")
            ) {

                return u.pathname
                    .split("/live/")[1]
                    .split("/")[0];
            }
        }


        /*
         * youtube.com/embed/VIDEO_ID
         */

        if (
            u.pathname.startsWith("/embed/")
        ) {

            return u.pathname
                .split("/embed/")[1]
                .split("/")[0];
        }

    }
    catch (e) {

        console.log("Invalid URL");

    }

    return null;
}


/* =====================================================
   PLAY / LOAD VIDEO
===================================================== */

function playVideo() {

    const url =
        document
            .getElementById("url")
            .value
            .trim();

    const videoId =
        getVideoId(url);


    if (!videoId) {

        alert("Inva");

        return;
    }


    const origin =
        encodeURIComponent(
            window.location.origin
        );


    /*
     * YOUR ORIGINAL METHOD
     */

    document.getElementById("player").src =
        `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&playsinline=1&enablejsapi=1&origin=${origin}`;


    /*
     * Wait for iframe to load,
     * then start listening for
     * currentTime information.
     */

    setTimeout(() => {

        startListening();

    }, 1000);
}


/* =====================================================
   SEND COMMAND TO YOUTUBE
===================================================== */

function youtubeCommand(
    command,
    args = []
) {

    const iframe =
        document.getElementById("player");


    if (
        !iframe ||
        !iframe.contentWindow
    ) {

        return;
    }


    iframe.contentWindow.postMessage(

        JSON.stringify({

            event: "command",

            func: command,

            args: args

        }),

        "https://www.youtube-nocookie.com"

    );
}


/* =====================================================
   PLAY / RESUME
===================================================== */

function resumeVideo() {

    youtubeCommand(
        "playVideo"
    );
}


/* =====================================================
   PAUSE
===================================================== */

function pauseVideo() {

    youtubeCommand(
        "pauseVideo"
    );
}


/* =====================================================
   CURRENT VIDEO TIME
===================================================== */

let currentVideoTime = 0;


/* =====================================================
   LISTEN FOR YOUTUBE INFORMATION
===================================================== */

window.addEventListener(
    "message",
    function(event) {

        /*
         * Only accept messages
         * from YouTube.
         */

        if (
            event.origin !==
            "https://www.youtube-nocookie.com"
        ) {

            return;
        }


        try {

            const data =
                typeof event.data === "string"
                    ? JSON.parse(event.data)
                    : event.data;


            /*
             * YouTube sends player
             * information using
             * infoDelivery.
             */

            if (
                data &&
                data.event === "infoDelivery" &&
                data.info
            ) {

                if (
                    typeof data.info.currentTime ===
                    "number"
                ) {

                    currentVideoTime =
                        data.info.currentTime;
                }
            }

        }
        catch (e) {

            /*
             * Ignore non-JSON messages.
             */

        }

    }
);


/* =====================================================
   START YOUTUBE LISTENER
===================================================== */

function startListening() {

    const iframe =
        document.getElementById("player");


    if (
        !iframe ||
        !iframe.contentWindow
    ) {

        return;
    }


    iframe.contentWindow.postMessage(

        JSON.stringify({

            event: "listening",

            id: 1,

            channel: "html5"

        }),

        "https://www.youtube-nocookie.com"

    );
}


/* =====================================================
   KEEP REQUESTING CURRENT TIME
===================================================== */

setInterval(

    function() {

        const iframe =
            document.getElementById("player");


        if (
            !iframe ||
            !iframe.contentWindow
        ) {

            return;
        }


        iframe.contentWindow.postMessage(

            JSON.stringify({

                event: "listening",

                id: 1,

                channel: "html5"

            }),

            "https://www.youtube-nocookie.com"

        );

    },

    250

);


/* =====================================================
   SKIP BACK 10 SECONDS
===================================================== */

function skipBack() {

    const newTime =
        Math.max(
            0,
            currentVideoTime - 10
        );


    youtubeCommand(

        "seekTo",

        [
            newTime,
            true
        ]

    );
}


/* =====================================================
   SKIP FORWARD 10 SECONDS
===================================================== */

function skipForward() {

    const newTime =
        currentVideoTime + 10;


    youtubeCommand(

        "seekTo",

        [
            newTime,
            true
        ]

    );
}


/* =====================================================
   CONVERT TIME TO SECONDS
===================================================== */

function timeToSeconds(time) {

    time =
        time.trim();


    if (!time) {

        return null;
    }


    const parts =
        time.split(":");


    /*
     * Example:
     *
     * 90
     */

    if (
        parts.length === 1
    ) {

        const seconds =
            Number(parts[0]);


        if (
            !Number.isFinite(seconds)
        ) {

            return null;
        }


        return seconds;
    }


    /*
     * Example:
     *
     * 45:00
     */

    if (
        parts.length === 2
    ) {

        const minutes =
            Number(parts[0]);

        const seconds =
            Number(parts[1]);


        if (
            !Number.isFinite(minutes) ||
            !Number.isFinite(seconds)
        ) {

            return null;
        }


        return (
            minutes * 60 +
            seconds
        );
    }


    /*
     * Example:
     *
     * 1:23:45
     */

    if (
        parts.length === 3
    ) {

        const hours =
            Number(parts[0]);

        const minutes =
            Number(parts[1]);

        const seconds =
            Number(parts[2]);


        if (
            !Number.isFinite(hours) ||
            !Number.isFinite(minutes) ||
            !Number.isFinite(seconds)
        ) {

            return null;
        }


        return (
            hours * 3600 +
            minutes * 60 +
            seconds
        );
    }


    return null;
}


/* =====================================================
   JUMP TO SPECIFIC TIME
===================================================== */

function jumpToTime() {

    const input =
        document
            .getElementById("jumpTime")
            .value;


    const seconds =
        timeToSeconds(input);


    if (
        seconds === null ||
        seconds < 0
    ) {

        alert(
            "Invalid time.\n\n" +
            "Examples:\n" +
            "45:00\n" +
            "1:30\n" +
            "1:23:45\n" +
            "90"
        );

        return;
    }


    /*
     * Seek to requested time.
     */

    youtubeCommand(

        "seekTo",

        [
            seconds,
            true
        ]

    );


    /*
     * Start playing after
     * jumping to the time.
     */

    youtubeCommand(
        "playVideo"
    );
}


/* =====================================================
   ENTER KEY FOR JUMP TIME
===================================================== */

document
    .getElementById("jumpTime")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                jumpToTime();

            }

        }
    );


/* =====================================================
   ENTER KEY FOR YOUTUBE URL
===================================================== */

document
    .getElementById("url")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                playVideo();

            }

        }
    );


</script>

</body>
</html>
