<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Player</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#222;
    color:white;
    text-align:center;
    margin:0;
    padding:40px;
}

input{
    width:500px;
    max-width:90%;
    padding:12px;
    font-size:16px;
}

button{
    padding:12px 18px;
    margin:5px;
    font-size:16px;
    cursor:pointer;
}

#player{
    margin:4000px auto;
    width:560px;
    max-width:100%;
}
</style>
</head>
<body>

<h2>YouTube Player</h2>

<input
    id="url"
    placeholder="Paste YouTube URL here">

<br><br>

<button onclick="loadVideo()">Load Video</button>
<button onclick="resumeVideo()">▶ Resume</button>
<button onclick="pauseVideo()">⏸ Pause</button>
<button onclick="stopVideo()">⏹ Stop</button>

<div id="player"></div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player;

// Called automatically by YouTube API
function onYouTubeIframeAPIReady() {
}

// Extract video ID from almost every YouTube URL
function getVideoId(url){

    const regex =
    /(?:youtube\.com\/(?:watch\?v=|live\/|embed\/|shorts\/)|youtu\.be\/)([^?&/]+)/;

    const match = url.match(regex);

    return match ? match[1] : null;
}

function loadVideo(){

    const url = document.getElementById("url").value.trim();

    const videoId = getVideoId(url);

    if(!videoId){
        alert("Invalid YouTube URL");
        return;
    }

    if(player){

        player.loadVideoById(videoId);

    }else{

        player = new YT.Player("player",{

            height:"315",
            width:"560",

            videoId:videoId,

            playerVars:{
                autoplay:1,
                rel:0
            }

        });

    }

}

function pauseVideo(){

    if(player){
        player.pauseVideo();
    }

}

function resumeVideo(){

    if(player){
        player.playVideo();
    }

}

function stopVideo(){

    if(player){
        player.stopVideo();
    }

}

</script>

</body>
</html>
