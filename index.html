<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>efffffect </title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#222;
    color:white;
    margin:0;
    text-align:center;
}

/* Hide scrollbar */
::-webkit-scrollbar{
    width:0;
}

/* Fixed top bar */
#toolbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#222;
    padding:15px;
    z-index:9999;
    box-sizing:border-box;
    border-bottom:1px solid #444;
}

input{
    width:500px;
    max-width:60%;
    padding:12px;
    font-size:16px;
}

button{
    padding:12px 18px;
    margin-left:5px;
    font-size:16px;
    cursor:pointer;
}

/* Push player down */
#player{
    margin-top:4000px;
    width:560px;
    margin-left:auto;
    margin-right:auto;
}
</style>
</head>
<body>


<div id="toolbar">
    <input id="url" placeholder="Paste">

    <button onclick="loadVideo()">Load</button>
    <button onclick="resumeVideo()">Resume</button>
    <button onclick="pauseVideo()">Pause</button>
    <button onclick="stopVideo()">Stop</button>
</div>

<div id="player"></div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player;

// Called automatically by YouTube API
function onYouTubeIframeAPIReady() {
}

// Extract video ID from almost every YouTube URL
function getVideoId(url){

    const regex =
    /(?:youtube\.com\/(?:watch\?v=|live\/|embed\/|shorts\/)|youtu\.be\/)([^?&/]+)/;

    const match = url.match(regex);

    return match ? match[1] : null;
}

function loadVideo(){

    const url = document.getElementById("url").value.trim();

    const videoId = getVideoId(url);

    if(!videoId){
        alert("Invalid YouTube URL");
        return;
    }

    if(player){

        player.loadVideoById(videoId);

    }else{

        player = new YT.Player("player",{

            height:"315",
            width:"560",

            videoId:videoId,

            playerVars:{
                autoplay:1,
                rel:0
            }

        });

    }

}

function pauseVideo(){

    if(player){
        player.pauseVideo();
    }

}

function resumeVideo(){

    if(player){
        player.playVideo();
    }

}

function stopVideo(){

    if(player){
        player.stopVideo();
    }

}

</script>

</body>
</html>
