<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Effect Placeboo</title>

<style>
body{
    font-family:Arial;
    background:#222;
    color:white;
    text-align:center;
    padding:40px;
}

/* width */
::-webkit-scrollbar {
  width: 0px;
}

/* Track */
::-webkit-scrollbar-track {
  background: #f1f1f1;
}

/* Handle */
::-webkit-scrollbar-thumb {
  background: #888;
}

/* Handle on hover */
::-webkit-scrollbar-thumb:hover {
  background: #555;
}

input{
    width:400px;
    padding:10px;
}

button{
    padding:10px 20px;
    margin-left:10px;
    cursor:pointer;
}

iframe{
    margin-top:3000px;
    border:0;
}
</style>

</head>
<body>

<input id="url" placeholder="Paste YouTube URL">
<button onclick="playVideo()">PLACEBOO</button>

<br><br>

<iframe
    id="player"
    width="560"
    height="315"
    src=""
    title="YouTube video player"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
</iframe>

<script>

function getVideoId(url){

    try{

        const u = new URL(url);

        // youtube.com/watch?v=
        if(u.hostname.includes("youtube.com") && u.pathname==="/watch"){
            return u.searchParams.get("v");
        }

        // youtu.be
        if(u.hostname==="youtu.be"){
            return u.pathname.substring(1);
        }

        // youtube.com/live/
        if(u.pathname.startsWith("/live/")){
            return u.pathname.split("/live/")[1];
        }

        // youtube.com/embed/
        if(u.pathname.startsWith("/embed/")){
            return u.pathname.split("/embed/")[1];
        }

    }catch(e){}

    return null;
}

function playVideo(){

    const url=document.getElementById("url").value.trim();

    const videoId=getVideoId(url);

    if(!videoId){
        alert("Invalid YouTube URL");
        return;
    }

    const origin=encodeURIComponent(window.location.origin);

    document.getElementById("player").src=
`https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&playsinline=1&enablejsapi=1&origin=${origin}`;

}

</script>

</body>
</html>
