<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Effect Placeboo</title>

<style>
body{
    font-family:Arial;
    background:#222;
    color:white;
    text-align:center;
    padding:40px;
    color:white;
}

textarea{
    width:600px;
    height:180px;
    padding:10px;
    margin:5px;
    background:#111;
    color:#fff;
    border:1px solid #555;
    resize:vertical;
}

input{
    width:400px;
    padding:10px;
    background-color: transparent;
}

button{
    padding:10px 20px;
    margin:5px;
    cursor:pointer;
}

iframe{
    margin-top:10000px;
    border:0;
}

/* Hide scrollbar */
::-webkit-scrollbar{
    width:0;
}
</style>

</head>
<body>

<h2>Remove Duplicate Domains</h2>

<textarea id="domains" placeholder="Paste domains here..."></textarea>
<br>

<button onclick="removeDuplicates()">Remove Duplicate Domains</button>

<br><br>

<textarea id="result" placeholder="Unique domains..." readonly></textarea>

<hr style="margin:400px 0;">

<input id="url" placeholder="Pas">
<button onclick="playVideo()">PLACEBOO</button>

<br><br>

<iframe
    id="player"
    width="560"
    height="315"
    src=""
    title="YouTube video player"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
</iframe>

<script>

function removeDuplicates(){

    const lines = document.getElementById("domains").value
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(x => x !== "");

    const unique = [...new Set(lines)];

    document.getElementById("result").value = unique.join("\n");
}

function getVideoId(url){

    try{

        const u = new URL(url);

        if(u.hostname.includes("youtube.com") && u.pathname==="/watch"){
            return u.searchParams.get("v");
        }

        if(u.hostname==="youtu.be"){
            return u.pathname.substring(1);
        }

        if(u.pathname.startsWith("/live/")){
            return u.pathname.split("/live/")[1];
        }

        if(u.pathname.startsWith("/embed/")){
            return u.pathname.split("/embed/")[1];
        }

    }catch(e){}

    return null;
}

function playVideo(){

    const url=document.getElementById("url").value.trim();

    const videoId=getVideoId(url);

    if(!videoId){
        alert("Invalid YouTube URL");
        return;
    }

    const origin=encodeURIComponent(window.location.origin);

    document.getElementById("player").src =
`https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&playsinline=1&enablejsapi=1&origin=${origin}`;

}

</script>

</body>
</html>
