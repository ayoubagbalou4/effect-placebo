<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Effe</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#222;
    color:white;
    margin:0;
    text-align:center;
}

/* Hide scrollbar */
::-webkit-scrollbar{
    width:0;
}

/* Fixed toolbar */
#toolbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#222;
    padding:10px;
    border-bottom:1px solid #444;
    z-index:9999;
    box-sizing:border-box;
}

input{
    width:320px;
    max-width:70%;
    padding:8px;
}

button{
    padding:8px 12px;
    margin-left:5px;
    cursor:pointer;
}

/* Push player down */
#player{
    margin-top:4000px;
    width:560px;
    height:315px;
    margin-left:auto;
    margin-right:auto;
}
</style>
</head>
<body>

<div id="toolbar">
    <input id="url" placeholder="Paste  ">

    <button onclick="loadVideo()">Load</button>
    <button onclick="resumeVideo()">Resume</button>
    <button onclick="pauseVideo()">Pause</button>
    <button onclick="stopVideo()">Stop</button>
</div>

<div id="player"></div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player = null;
let playerReady = false;

// Called automatically by YouTube API
function onYouTubeIframeAPIReady() {

    player = new YT.Player("player", {
        height: "315",
        width: "560",
        videoId: "",

        playerVars: {
            autoplay: 1,
            rel: 0
        },

        events: {
            onReady: function () {
                playerReady = true;
                console.log("Player ready");
            }
        }
    });
}

// Extract video ID
function getVideoId(url){

    const match = url.match(
        /(?:youtube\.com\/(?:watch\?v=|embed\/|live\/|shorts\/)|youtu\.be\/)([^?&/]+)/
    );

    return match ? match[1] : null;
}

function loadVideo(){

    if(!playerReady){
        alert("Player is still loading...");
        return;
    }

    const url = document.getElementById("url").value.trim();

    const videoId = getVideoId(url);

    if(!videoId){
        alert("Invalid YouTube URL");
        return;
    }

    player.loadVideoById(videoId);

}

function pauseVideo(){

    if(playerReady){
        player.pauseVideo();
    }

}

function resumeVideo(){

    if(playerReady){
        player.playVideo();
    }

}

function stopVideo(){

    if(playerReady){
        player.stopVideo();
    }

}

</script>

</body>
</html>
