<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Digit Image Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .app {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        }

        #numberImage {
            display: block;
            width: 300px;
            height: 150px;
            margin: 20px auto;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            padding: 12px 25px;
            border: 0;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<div class="app">
    <h2>3 Digit Number Generator</h2>

    <img id="numberImage" alt="Generated number">

    <button onclick="generateNumber()">Generate Number</button>
</div>

<script>
function generateNumber() {

    // Generate a random 3-digit number
    const number = Math.floor(100 + Math.random() * 900);

    // Create an image using Canvas
    const canvas = document.createElement("canvas");
    canvas.width = 600;
    canvas.height = 300;

    const ctx = canvas.getContext("2d");

    // Background
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Number styling
    ctx.fillStyle = "#000000";
    ctx.font = "bold 150px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // Put the number INTO the image
    ctx.fillText(String(number), canvas.width / 2, canvas.height / 2);

    // Convert canvas to image
    const image = document.getElementById("numberImage");
    image.src = canvas.toDataURL("image/png");
}

// Generate one automatically when the page loads
generateNumber();
</script>

</body>
</html>
