<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Effect Placeboo</title>

<style>
body {
    font-family: Arial;
    background: #222;
    color: white;
    text-align: center;
    padding: 40px;
}

textarea {
    width: 600px;
    height: 180px;
    padding: 10px;
    margin: 5px;
    background: #111;
    color: #fff;
    border: 1px solid #555;
    resize: vertical;
}

input {
    width: 400px;
    padding: 10px;
    background-color: transparent;
    color: white;
    border: 1px solid #555;
}

button {
    padding: 10px 20px;
    margin: 5px;
    cursor: pointer;
    border: 0;
}

.btn {
    background-color: green;
    color: white;
}

.btnn {
    background-color: transparent;
    color: white;
    border: 1px solid #555;
}

.controls {
    margin-top: 15px;
}

.controls button {
    background: #333;
    color: white;
    border: 1px solid #666;
}

.controls button:hover {
    background: #555;
}

.time-box {
    margin-top: 15px;
}

.time-box input {
    width: 150px;
}

iframe {
    margin-top: 50px;
    border: 0;
}

/* Hide scrollbar */
::-webkit-scrollbar {
    width: 0;
}
</style>

</head>

<body>

<h2>Remove Duplicate Domains</h2>

<textarea id="domains" placeholder="Paste domains here..."></textarea>

<br>

<button class="btn" onclick="removeDuplicates()">
    Remove Duplicate Domains
</button>

<br><br>

<textarea id="result" placeholder="Unique domains..." readonly></textarea>

<hr style="margin:5px 0;">

<input id="url" placeholder="Paste YouTube URL">

<button class="btnn" onclick="playVideo()">
    PLACEBOO
</button>

<br><br>

<!-- YouTube Player -->

<div id="player"></div>

<!-- Video Controls -->

<div class="controls">

```
<button onclick="resumeVideo()">▶ Play / Resume</button>

<button onclick="pauseVideo()">⏸ Pause</button>

<button onclick="skipBack()">⏪ -10s</button>

<button onclick="skipForward()">⏩ +10s</button>
```

</div>

<!-- Jump to Time -->

<div class="time-box">

```
<input
    id="jumpTime"
    placeholder="Example: 45:00"
>

<button onclick="jumpToTime()">
    ⏱️ Go to Time
</button>
```

</div>

<script>

/* =========================
   REMOVE DUPLICATES
========================= */

function removeDuplicates() {

    const lines = document.getElementById("domains").value
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(x => x !== "");

    const unique = [...new Set(lines)];

    document.getElementById("result").value =
        unique.join("\n");
}


/* =========================
   YOUTUBE PLAYER
========================= */

let player;


/* Load YouTube IFrame API */

let tag = document.createElement("script");

tag.src = "https://www.youtube.com/iframe_api";

let firstScriptTag =
    document.getElementsByTagName("script")[0];

firstScriptTag.parentNode.insertBefore(
    tag,
    firstScriptTag
);


/* YouTube API calls this function automatically */

function onYouTubeIframeAPIReady() {

    player = new YT.Player("player", {
        width: "560",
        height: "315",
        videoId: "",
        playerVars: {
            autoplay: 0,
            rel: 0,
            modestbranding: 1,
            playsinline: 1
        },
        events: {
            onReady: function() {
                console.log("YouTube player ready");
            }
        }
    });
}


/* =========================
   GET VIDEO ID
========================= */

function getVideoId(url) {

    try {

        const u = new URL(url);

        /*
         * youtube.com/watch?v=VIDEO_ID
         */
        if (
            (u.hostname === "youtube.com" ||
             u.hostname === "www.youtube.com") &&
            u.pathname === "/watch"
        ) {
            return u.searchParams.get("v");
        }

        /*
         * youtu.be/VIDEO_ID
         */
        if (
            u.hostname === "youtu.be" ||
            u.hostname === "www.youtu.be"
        ) {
            return u.pathname.substring(1).split("/")[0];
        }

        /*
         * youtube.com/live/VIDEO_ID
         */
        if (u.pathname.startsWith("/live/")) {

            return u.pathname
                .split("/live/")[1]
                .split("/")[0];
        }

        /*
         * youtube.com/embed/VIDEO_ID
         */
        if (u.pathname.startsWith("/embed/")) {

            return u.pathname
                .split("/embed/")[1]
                .split("/")[0];
        }

    } catch (e) {}

    return null;
}


/* =========================
   LOAD VIDEO
========================= */

function playVideo() {

    const url =
        document.getElementById("url").value.trim();

    const videoId = getVideoId(url);

    if (!videoId) {

        alert("Invalid YouTube URL");

        return;
    }

    if (!player) {

        alert("YouTube player is still loading. Please try again.");

        return;
    }

    player.loadVideoById(videoId);

}


/* =========================
   PLAY / RESUME
========================= */

function resumeVideo() {

    if (!player) return;

    player.playVideo();
}


/* =========================
   PAUSE
========================= */

function pauseVideo() {

    if (!player) return;

    player.pauseVideo();
}


/* =========================
   SKIP BACK 10 SECONDS
========================= */

function skipBack() {

    if (!player) return;

    const currentTime =
        player.getCurrentTime();

    player.seekTo(
        Math.max(0, currentTime - 10),
        true
    );
}


/* =========================
   SKIP FORWARD 10 SECONDS
========================= */

function skipForward() {

    if (!player) return;

    const currentTime =
        player.getCurrentTime();

    const duration =
        player.getDuration();

    player.seekTo(
        Math.min(duration, currentTime + 10),
        true
    );
}


/* =========================
   CONVERT TIME
=========================

   Supports:

   45
   45:00
   1:30
   1:23:45
*/

function timeToSeconds(time) {

    time = time.trim();

    if (!time) {
        return null;
    }

    const parts = time.split(":");

    /*
     * 45
     */
    if (parts.length === 1) {

        const seconds =
            Number(parts[0]);

        return Number.isFinite(seconds)
            ? seconds
            : null;
    }

    /*
     * 45:00
     */
    if (parts.length === 2) {

        const minutes =
            Number(parts[0]);

        const seconds =
            Number(parts[1]);

        if (
            !Number.isFinite(minutes) ||
            !Number.isFinite(seconds)
        ) {
            return null;
        }

        return minutes * 60 + seconds;
    }

    /*
     * 1:23:45
     */
    if (parts.length === 3) {

        const hours =
            Number(parts[0]);

        const minutes =
            Number(parts[1]);

        const seconds =
            Number(parts[2]);

        if (
            !Number.isFinite(hours) ||
            !Number.isFinite(minutes) ||
            !Number.isFinite(seconds)
        ) {
            return null;
        }

        return (
            hours * 3600 +
            minutes * 60 +
            seconds
        );
    }

    return null;
}


/* =========================
   JUMP TO TIME
========================= */

function jumpToTime() {

    if (!player) return;

    const input =
        document.getElementById("jumpTime").value;

    const seconds =
        timeToSeconds(input);

    if (seconds === null || seconds < 0) {

        alert(
            "Invalid time.\n\n" +
            "Examples:\n" +
            "45:00\n" +
            "1:30\n" +
            "1:23:45"
        );

        return;
    }

    const duration =
        player.getDuration();

    if (
        duration &&
        seconds > duration
    ) {

        alert(
            "That time is longer than the video."
        );

        return;
    }

    player.seekTo(seconds, true);

    player.playVideo();
}

</script>

</body>
</html>
