<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Number CAPTCHA</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #fff;
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
  }

  .captcha-wrap {
    width: 336px;
    margin: 20px auto;
    text-align: center;
  }

  .captcha-box {
    border: 1px solid #e5e5e5;
    border-radius: 5px;
    padding: 20px 7px 10px;
    box-shadow: 0 0 2px rgba(0,0,0,.04);
  }

  .instruction {
    margin: 0 0 24px;
    font-size: 15px;
    color: #17365d;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    gap: 10px;
    justify-content: center;
  }

  .tile {
    width: 100px;
    height: 100px;
    padding: 0;
    border: 3px solid #c6c6c6;
    border-radius: 6px;
    background: #eee;
    cursor: pointer;
    overflow: hidden;
    position: relative;
  }

  .tile img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .tile.selected {
    border: 4px solid #1877f2;
    box-shadow: 0 0 0 2px rgba(24,119,242,.22);
  }

  .tile.selected::after {
    content: "✓";
    position: absolute;
    right: 4px;
    top: 4px;
    width: 24px;
    height: 24px;
    line-height: 24px;
    border-radius: 50%;
    background: #1877f2;
    color: white;
    font-weight: bold;
    font-size: 16px;
  }

  .links {
    display: flex;
    justify-content: space-between;
    padding: 21px 31px 18px;
    font-size: 15px;
  }

  .links a {
    color: #06f;
    text-decoration: none;
    cursor: pointer;
  }

  .submit {
    width: 330px;
    height: 38px;
    border: 0;
    border-radius: 4px;
    background: #20a943;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }

  .submit:hover {
    background: #198f38;
  }

  .result {
    min-height: 24px;
    margin-top: 10px;
    font-size: 14px;
  }

  .result.ok { color: #168a35; }
  .result.bad { color: #c62828; }
</style>
</head>

<body>
<div class="captcha-wrap">

  <div class="captcha-box">
    <p class="instruction">
    Please select all boxes with number
    <strong id="targetText"></strong>
</p>

    <div id="grid" class="grid"></div>
  </div>

  <div class="links">
    <a id="clearBtn">Clear Selection</a>
    <a href="#">Goto Login Page</a>
  </div>

  <button class="submit" id="submitBtn">Submit</button>
  <div id="result" class="result"></div>
</div>

<script>
const TILE_COUNT = 9;
const CORRECT_COUNT = 4;

let targetNumber;
let tiles = [];

// Random 3-digit number
function randomNumber() {
    return Math.floor(100 + Math.random() * 900);
}

// Shuffle array
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

// Create number as an IMAGE using Canvas
function createNumberImage(number) {
    const canvas = document.createElement("canvas");

    canvas.width = 200;
    canvas.height = 200;

    const ctx = canvas.getContext("2d");

    // Random background
    const backgrounds = [
        "#c8eee9",
        "#f0eff7",
        "#eeeecc",
        "#cce6bd",
        "#a8e2d1",
        "#e1e2c9",
        "#eeeeef",
        "#bfe2e7",
        "#edf2f4"
    ];

    const colors = [
        "#b84ee8",
        "#486a98",
        "#c36fbd",
        "#3e70b1",
        "#a4cc39",
        "#3c7e55",
        "#14567d",
        "#d86586",
        "#507276"
    ];

    ctx.fillStyle =
        backgrounds[Math.floor(Math.random() * backgrounds.length)];

    ctx.fillRect(0, 0, 200, 200);

    // Image noise
    for (let i = 0; i < 1500; i++) {
        ctx.fillStyle = `rgba(80,80,80,${Math.random() * 0.12})`;

        ctx.fillRect(
            Math.random() * 200,
            Math.random() * 200,
            1,
            1
        );
    }

    // Random rotation
    ctx.save();

    ctx.translate(100, 105);

    const rotation =
        (Math.random() * 6 - 3) * Math.PI / 180;

    ctx.rotate(rotation);

    ctx.font = "bold 72px Georgia, serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle =
        colors[Math.floor(Math.random() * colors.length)];

    // Number is rendered directly into the image
    ctx.fillText(String(number), 0, 0);

    ctx.restore();

    return canvas.toDataURL("image/png");
}


// Generate a completely new CAPTCHA
function generateCaptcha() {

    // New random target
    targetNumber = randomNumber();

    document.getElementById("targetText").textContent =
        targetNumber;

    tiles = [];

    // 4 correct images
    for (let i = 0; i < CORRECT_COUNT; i++) {
        tiles.push({
            id: crypto.randomUUID(),
            number: targetNumber,
            correct: true
        });
    }

    // 5 random incorrect images
    while (tiles.length < TILE_COUNT) {

        const number = randomNumber();

        if (number !== targetNumber) {
            tiles.push({
                id: crypto.randomUUID(),
                number: number,
                correct: false
            });
        }
    }

    shuffle(tiles);

    renderCaptcha();
}


// Render images
function renderCaptcha() {

    const grid = document.getElementById("grid");

    grid.innerHTML = "";

    tiles.forEach(tile => {

        const button = document.createElement("button");

        button.type = "button";
        button.className = "tile";

        // Only an ID is stored.
        // There is NO data-number attribute.
        button.dataset.id = tile.id;

        const image = document.createElement("img");

        image.src = createNumberImage(tile.number);
        image.alt = "Number image";

        button.appendChild(image);

        grid.appendChild(button);

        button.addEventListener("click", () => {
            button.classList.toggle("selected");
        });
    });
}


// Submit
document.getElementById("submitBtn").addEventListener("click", () => {

    const selectedIds = new Set(
        [...document.querySelectorAll(".tile.selected")]
            .map(tile => tile.dataset.id)
    );

    const correctIds = new Set(
        tiles
            .filter(tile => tile.correct)
            .map(tile => tile.id)
    );

    const correct =
        selectedIds.size === correctIds.size &&
        [...correctIds].every(id =>
            selectedIds.has(id)
        );

    const result = document.getElementById("result");

    if (correct) {
        result.textContent = "✓ Correct!";
        result.className = "result ok";
    } else {
        result.textContent = "✕ Please try again.";
        result.className = "result bad";
    }
});


// Clear
document.getElementById("clearBtn").addEventListener("click", () => {

    document
        .querySelectorAll(".tile.selected")
        .forEach(tile => {
            tile.classList.remove("selected");
        });
});


// Start with a random CAPTCHA
generateCaptcha();
</script>
</body>
</html>
